<!DOCTYPE html><html class="dark" lang="en" style=""><head>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;

<body class="bg-background text-on-surface font-body antialiased min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary">
<!-- Header / Top Bar -->
<header class="w-full flex items-center justify-between px-5 py-3.5 bg-background sticky top-0 z-50">
<button aria-label="Restart" class="w-9 h-9 rounded-lg flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-xl">restart_alt</span>
</button>
<div class="font-mono text-xs font-semibold tracking-widest text-on-surface-variant uppercase">CIPHER</div>
<button aria-label="Toggle Sound" class="w-9 h-9 rounded-lg flex items-center justify-center text-secondary hover:text-primary hover:bg-surface-container transition-colors" id="sound-btn">
<span class="material-symbols-outlined text-xl">volume_up</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 max-w-md w-full mx-auto px-5 pb-6 flex flex-col gap-6">
<!-- Hero Title & Subtitle -->
<div class="flex flex-col gap-1 text-center pt-1">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface">
      Local Game
    </h1>
<p class="text-xs font-mono text-on-surface-variant">
      4 digits • No repeated numbers • Circular Relay
    </p>
</div>
<!-- Minimal Rules Card -->
<section class="bg-surface-container rounded-2xl p-4 border border-outline-variant flex flex-col gap-2.5">
<div class="flex items-center gap-3">
<span class="w-6 h-6 rounded bg-tertiary-container/30 border border-tertiary/40 text-tertiary font-mono font-bold text-xs flex items-center justify-center shrink-0">
        M
      </span>
<div class="flex items-baseline gap-1.5 text-xs">
<span class="font-semibold text-on-surface">Match:</span>
<span class="text-on-surface-variant">Correct number &amp; position</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="w-6 h-6 rounded bg-primary/20 border border-primary/40 text-primary font-mono font-bold text-xs flex items-center justify-center shrink-0">
        F
      </span>
<div class="flex items-baseline gap-1.5 text-xs">
<span class="font-semibold text-on-surface">Found:</span>
<span class="text-on-surface-variant">Correct number, wrong position</span>
</div>
</div>
</section>
<!-- Player Count Selector -->
<div class="flex flex-col gap-2">
<span class="text-[11px] font-mono uppercase tracking-wider text-secondary font-medium">Players</span>
<section class="grid grid-cols-4 gap-2">
<button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center">
        2P
      </button>
<button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center">
        3P
      </button>
<button class="py-2.5 px-2 rounded-xl text-xs font-mono font-semibold bg-surface-container-highest text-primary border border-primary/40 shadow-inner text-center">
        4P
      </button>
<button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">smart_toy</span>
<span class="">Bot</span>
</button>
</section>
</div>
<!-- Assigned Targets / Circular Targets List -->

<!-- Primary Bottom CTA -->
<div class="flex flex-col gap-2"><span class="text-[11px] font-mono uppercase tracking-wider text-secondary font-medium">Turn Timer</span><section class="grid grid-cols-4 gap-2"><button class="py-2.5 px-2 rounded-xl text-xs font-mono font-semibold bg-surface-container-highest text-primary border border-primary/40 shadow-inner text-center">None</button><button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center">1m</button><button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center">3m</button><button class="py-2.5 px-2 rounded-xl text-xs font-mono text-secondary hover:text-on-surface bg-surface-container border border-outline-variant transition-all text-center">5m</button></section></div><div class="pt-2 flex flex-col gap-2.5">
<a class="w-full py-4 px-6 rounded-xl bg-primary text-on-primary font-headline font-semibold text-sm flex items-center justify-center gap-2 tracking-wide uppercase shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.99] transition-all" href="#setup-stage">
<span class="">Start Code Setup</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</a>
<p class="text-center text-[11px] font-mono text-secondary">
      Secretly pass device to each player to input passcodes
    </p>
</div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const soundBtn = document.getElementById('sound-btn');
    let soundEnabled = true;
    if (soundBtn) {
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        const icon = soundBtn.querySelector('span');
        if (icon) {
          icon.textContent = soundEnabled ? 'volume_up' : 'volume_off';
          icon.classList.toggle('text-secondary', !soundEnabled);
          icon.classList.toggle('text-primary', soundEnabled);
        }
      });
    }
  });
</script>


</body></html>
