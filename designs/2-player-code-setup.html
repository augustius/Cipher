<!-- BOTTOM NAV BAR (Shared Component from JSON, active state mapped to Pass) -->

<!-- Interactive script for toggle digits & micro-animations -->
<script>
    const toggleBtn = document.getElementById('toggle-visibility');
    const digits = document.querySelectorAll('.digit-val');
    const icon = document.getElementById('visibility-icon');
    let isHidden = false;

    toggleBtn.addEventListener('click', () => {
      isHidden = !isHidden;
      digits.forEach(slot => {
        if (isHidden) {
          slot.dataset.saved = slot.textContent;
          slot.textContent = '•';
        } else {
          slot.textContent = slot.dataset.val || '8';
        }
      });
      icon.textContent = isHidden ? 'visibility_off' : 'visibility';
    });
  </script>
